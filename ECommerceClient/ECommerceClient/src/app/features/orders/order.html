<div class="mx-auto mt-32">
    <h2 class="font-semibold text-2xl mb-6 text-center">Siparişlerim</h2>
    <div class="flex flex-col">
        <div class="w-full">
            <table class="min-w-full divide-y divide-gray-200 cursor-pointer">
                <thead class="bg-gray-50">
                    <tr class="uppercase text-gray-600 text-sm">
                        <th class="text-center px-6 py-3">Sipariş</th>
                        <th class="text-left">Tarih</th>
                        <th class="text-left">Toplam</th>
                        <th class="text-left">Durum</th>

                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    @for (order of orders; track order.id) {
                        <tr routerLink="/order/{{order.id}}" class="hover:bg-gray-100">
                            <th class="px-6 py-3"> {{order.id}}</th>
                            <td> {{order.orderDate | date: 'medium'}}</td>
                            <td>{{order.total| currency }}</td>
                            <td>{{order.status}}</td>
                            
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
