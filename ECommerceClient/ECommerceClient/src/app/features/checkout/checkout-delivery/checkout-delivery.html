<div class="w-full">
    <div class="text-lg font-semibold mb-4">Kargo Seçiniz</div>
    
    <mat-radio-group 
        [value]="cartService.selectedDelivery()?.id"
        class="grid grid-cols-2 gap-4"
        (change)="updateDeliveryMethod($event.value)">
        
        @for (method of checkoutService.deliveryMethods; track $index) {
            <label class="p-4 border border-gray-200 rounded-lg cursor-pointer w-full h-full hover:bg-purple-100 transition-colors duration-200">
                <mat-radio-button
                    class="w-full h-full"
                    [checked]="cartService.selectedDelivery() === method"
                    [value]="method">
                    <div class="flex flex-col w-full h-full ml-2">
                        <strong class="text-base">{{method.shortName}} - {{method.price | currency}}</strong>
                        <span class="text-sm text-gray-600 mt-1">{{method.description}}</span>
                    </div>
                </mat-radio-button>
            </label>
        }
    </mat-radio-group>
</div>
