<div class="flex mt-32 gap-6">
    <div class="w-3/4">
        <mat-stepper
        (selectionChange)="onStepChange($event)"
        [linear]="true"
         #stepper 
         class="bg-white border border-gray-200 shadow-sm">
            <mat-step label="Adres" [completed]="completionStatus().address">
                <div id="address-element"></div>
                <div class="flex justify-end mt-1">
                    <mat-checkbox
                    [checked]="saveAddress"
                    (change)="onSaveAddressCheckboxChange($event)"
                    >Adresi kaydet
                </mat-checkbox>
                </div>
                    <div class="flex justify-between mt-6">
                        <button
                         class="z-0" routerLink="/" mat-stroked-button>Alışverişe Devam</button>
                        <button
                        [disabled]="!completionStatus().address"
                        class="z-0" matStepperNext mat-flat-button>İleri</button>
                    </div>
            </mat-step>
            <mat-step label="Kargo" [completed]="completionStatus().delivery">
                <app-checkout-delivery (deliveryComplete)="handleDeliveryChange($event)"></app-checkout-delivery>
                        <div class="flex justify-between mt-6">
                        <button matStepperPrevious mat-stroked-button>Geri</button>
                        <button 
                        [disabled]="!completionStatus().delivery"
                        matStepperNext mat-flat-button>İleri</button>
                    </div>
            </mat-step>
       <mat-step label="Ödeme" [completed]="completionStatus().card">
                <div id="payment-element"></div>
                        <div class="flex justify-between mt-6">
                        <button matStepperPrevious mat-stroked-button>Geri</button>
                        <button
                        [disabled]="!completionStatus().card" 
                        matStepperNext mat-flat-button>İleri</button>
                     
                    </div>
                                        
                        <div class="mt-4 w-full ml-4">
                          <div class="bg-gray-50 border border-gray-200 rounded p-3 text-sm text-gray-700">
                            <div class="font-medium mb-2">Ödeme Örneği</div>
                            <table class="w-full text-sm">
                              <tr>
                                <td class="py-1 font-medium">Kart Numarası</td>
                                <td class="py-1 text-right">4242 4242 4242 4242 - 5555 5555 5555 4444 - 4000 0000 0000 0002(Reddedilen Kart)</td>
                              </tr>
                              <tr>
                                <td class="py-1 font-medium">Son Kullanma</td>
                                <td class="py-1 text-right">04/44</td>
                              </tr>
                              <tr>
                                <td class="py-1 font-medium">Güvenlik Kodu (CVC)</td>
                                <td class="py-1 text-right">444</td>
                              </tr>
                            </table>
                            <div class="text-xs text-gray-500 mt-2">Test karta ait örnek bilgiler — canlı ödemelerde gerçek kart kullanmayın.</div>
                          </div>
                        </div>
                    
            </mat-step>
            <mat-step label="Onaylama">
                <app-checkout-review [confirmationToken]="confirmationToken()"></app-checkout-review>
                        <div class="flex justify-between mt-6">
                        <button matStepperPrevious mat-stroked-button>Geri</button>
                        <button mat-flat-button
                        [disabled]="!confirmationToken || loading"
                        (click)="confirmPayment(stepper)"
                        >
                        @if (loading) {
                            <mat-spinner diameter="20"></mat-spinner>
                        } @else {
                            <span>Öde {{cartService.totals()?.total | currency:'₺':'symbol':'1.2-2'}}</span>
                        }

                    </button>
                    </div>
            
            </mat-step>
        </mat-stepper>
    </div>
    <div class="w-1/4">
        <app-order-summary></app-order-summary>
    </div>
</div>
