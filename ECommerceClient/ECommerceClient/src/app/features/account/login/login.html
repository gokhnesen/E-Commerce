<mat-card class="max-w-lg mx-auto mt-32 p-8 bg-white">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-semibold text-primary">Giriş</h1>
        </div>
        <mat-form-field appearance="outline" class="w-full mb-4">
            <mat-label>Email Adresi</mat-label>
            <input formControlName="email" placeholder="name@example.com" matInput>
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full mb-4">
            <mat-label>Şifre</mat-label>
            <input formControlName="password" type="password" placeholder="Şifre" matInput>
        </mat-form-field>

        @if (validationErrors) {
            <div class="mb-3 p-4 bg-red-100 text-red-600">
                <ul class="list-disc px-3">
                    @for (err of validationErrors; track $index) {
                        <li>{{ err }}</li>
                    }
                </ul>
            </div>
        }

        <button mat-flat-button type="submit" class="w-full py-2">Giriş Yap</button>
    </form>

    <!-- Küçük info kutusu -->
    <div class="mt-4 w-full">
        <div class="bg-gray-50 border border-gray-200 rounded p-3 text-sm text-gray-700">
            <div class="font-medium mb-2">Örnek Giriş Bilgileri</div>
            <table class="w-full text-sm">
                <tr>
                    <td class="py-1 font-medium">Admin:</td>
                    <td class="py-1 text-right">gokhan&#64;test.com / Pa$$w0rd</td>
                </tr>
                <tr>
                    <td class="py-1 font-medium">User:</td>
                    <td class="py-1 text-right">bob&#64;test.com / Pa$$w0rd</td>
                </tr>
            </table>
        </div>
    </div>
</mat-card>
