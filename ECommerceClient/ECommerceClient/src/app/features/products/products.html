@if(products && products.length > 0){
<div class="container mx-auto p-4">
   <div class="flex justify-between gap-3 mb-4">

      <div class="flex gap-3">
         <button class="match-input-height" mat-stroked-button [matMenuTriggerFor]="sortMenu">
            <mat-icon>swap_vert</mat-icon>
            Sırala
         </button>
      </div>
   </div>
   
   <div class="flex gap-6">
      <!-- Products Grid with Infinite Scroll -->
      <div class="w-full"
           infiniteScroll
           [infiniteScrollDistance]="2"
           [infiniteScrollThrottle]="50"
           (scrolled)="onScroll()">
         <div class="grid grid-cols-4 gap-4">
            @for (product of products; track product.id) {
               <app-product-item [product]="product"></app-product-item>
            }
         </div>
         
         <!-- Loading indicator -->
         <div *ngIf="loading" class="flex justify-center my-8">
            <mat-spinner [diameter]="40"></mat-spinner>
         </div>
         
         <!-- End of products message -->
         <div *ngIf="!loading && noMoreProducts" class="text-center my-8 text-gray-500">
            Tüm ürünleri gördünüz
         </div>
      </div>
   </div>
</div>

<mat-menu #sortMenu="matMenu">
   <mat-selection-list [multiple]="false" (selectionChange)="onSortChange($event)">
      @for (sort of sortOptions; track $index) {
         <mat-list-option [value]="sort.value" [selected]="shopParams.sort == sort.value">
            {{sort.name}}
         </mat-list-option>
      }
   </mat-selection-list>
</mat-menu>
} @else if(loading) {
<div class="flex justify-center my-8">
   <mat-spinner [diameter]="40"></mat-spinner>
</div>
} @else {
<div class="text-center my-8">
   <p class="text-gray-500">Ürün bulunamadı.</p>
</div>
}
