@if(products$){
<div class="flex flex-col gap-3">
   <div class="flex justify-between gap-3">
      <mat-paginator
      class="bg-white" 
      (page)="handlePageEvent($event)"
      [length]="totalCount"
      [pageSize]="shopParams.pageSize"
      [showFirstLastButtons]="true"
      [pageSizeOptions]="pageSizeOptions"
      [pageIndex]="shopParams.pageNumber - 1"
      aria-label="Select page"
      >
      </mat-paginator>
      <form 
      #searchForm="ngForm" 
      (ngSubmit)="onSearchChange()"
      class="relative flex items-center w-full max-w-md mx-4"
   
   >
   <input 
   type="search" 
   class="block w-full p4 text-sm text-gray-900 border border-gray-300 rounded-lg"
   placeholder="Search"
   name="search"
   [(ngModel)]="shopParams.search"
   >
   <button mat-icon-button type="submit" class="absolute inset-y-0 right-8 top-2 flex items-center pl-3">
      <mat-icon>search</mat-icon>
     
   </button>
</form>
      <div class="flex gap-3">
               <button class="match-input-height" mat-stroked-button (click)="openFiltersDialog()">
         <mat-icon>filter_lists</mat-icon>
         Filtrele
      </button>
            <button class="match-input-height" mat-stroked-button [matMenuTriggerFor]="sortMenu">
         <mat-icon>swap_vert</mat-icon>
         Sırala
      </button>
      
      <!-- DEBUG BUTTONS - Loading stuck için -->
      <button class="match-input-height" mat-stroked-button color="warn" (click)="checkLoadingState()">
         <mat-icon>bug_report</mat-icon>
         Check
      </button>
      <button class="match-input-height" mat-stroked-button color="accent" (click)="resetLoading()">
         <mat-icon>refresh</mat-icon>
         Reset
      </button>

      </div>

   </div>
   <div class="grid grid-cols-5 gap-4">
    @for (product of (products$ | async); track product.id)
     {
        <app-product-item [product]="product"></app-product-item>
     }
</div>
</div>



<mat-menu #sortMenu="matMenu">
   <mat-selection-list [multiple]="false" (selectionChange)="onSortChange($event)">
      @for (sort of sortOptions; track $index) {
         <mat-list-option [value]="sort.value" [selected]="shopParams.sort == sort.value">
            {{sort.name}}
         </mat-list-option>
      }
   </mat-selection-list>
</mat-menu>
}
